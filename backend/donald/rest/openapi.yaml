components:
    schemas:
        AgentEdge:
            properties:
                condition_label:
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                created_by:
                    format: uuid
                    type: string
                edge_type:
                    $ref: '#/components/schemas/AgentEdgeType'
                from_node_uuid:
                    format: uuid
                    type: string
                run_uuid:
                    format: uuid
                    type: string
                status:
                    $ref: '#/components/schemas/AgentEdgeStatus'
                to_node_uuid:
                    format: uuid
                    type: string
                updated_at:
                    format: date-time
                    type: string
                updated_by:
                    format: uuid
                    type: string
                uuid:
                    format: uuid
                    type: string
            required:
                - uuid
                - run_uuid
                - from_node_uuid
                - to_node_uuid
                - edge_type
                - status
                - created_by
                - updated_by
                - created_at
                - updated_at
            type: object
        AgentEdgeList:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AgentEdge'
                    type: array
                next_page_token:
                    type: string
            type: object
        AgentEdgeStatus:
            enum:
                - invalid
                - pending
                - traversed
                - skipped
                - removed
            type: string
        AgentEdgeType:
            enum:
                - invalid
                - dependency
                - transition
                - conditional
                - retry
                - fallback
                - subagent_spawn
            type: string
        AgentEvent:
            properties:
                agent_label:
                    nullable: true
                    type: string
