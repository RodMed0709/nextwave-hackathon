                    type: string
                node_uuid:
                    format: uuid
                    nullable: true
                    type: string
                occurred_at:
                    format: date-time
                    type: string
                payload:
                    $ref: '#/components/schemas/AgentEventPayload'
                    nullable: true
                run_uuid:
                    format: uuid
                    type: string
                sequence:
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/AgentEventStatus'
                updated_at:
                    format: date-time
                    type: string
                updated_by:
                    format: uuid
                    type: string
                uuid:
                    format: uuid
                    type: string
            required:
                - uuid
                - run_uuid
                - sequence
                - event_type
                - idempotency_key
                - occurred_at
                - status
                - created_by
                - updated_by
