# Default values for donald-web — the Next.js frontend.
#
# Built on the box by scripts/04-build-web.sh and imported into containerd, the
# same way as the API image. There is no registry, so pullPolicy must NOT be
# Always and the tag must be unique per build (a reused tag leaves the kubelet on
# the previous layers).
#
# Set `web.enabled: false` in deploy-web.sh terms by simply not running the web
# step — the chart still reserves donald.todes.mx, its Service and its TLS cert.

replicaCount: 1

image:
  repository: donald-web
  pullPolicy: IfNotPresent
  # Overridden per deploy with --set image.tag=<timestamp>. Never "latest".
  tag: "placeholder"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

# The real app is in place, so the holding-page ConfigMap and its mount are off.
# Flip back to true to serve the static placeholder again without touching the
# ingress or the certificate.
placeholder:
  enabled: false

service:
  type: ClusterIP
  # Next.js binds 3000; the placeholder nginx image used 8080.
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt
  hosts:
    - host: donald.todes.mx
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: donald-web-tls
      hosts:
        - donald.todes.mx

resources:
  limits:
    cpu: 500m
    # A Next server needs far more headroom than the nginx placeholder did.
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
