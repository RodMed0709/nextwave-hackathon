{{- if .Values.placeholder.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "donald-web.fullname" . }}-placeholder
  labels:
    {{- include "donald-web.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <meta charset="utf-8">
    <title>donald</title>
    <style>
      body { font: 16px/1.6 system-ui, sans-serif; margin: 0; display: grid;
             place-items: center; min-height: 100vh; background: #0f1115; color: #e6e9ef; }
      main { max-width: 34rem; padding: 2rem; }
      code { background: #1b1f27; padding: .15em .4em; border-radius: 4px; }
      a { color: #7aa2f7; }
    </style>
    <main>
      <h1>donald</h1>
      <p>Frontend not deployed yet — this hostname is reserved.</p>
      <ul>
        <li>REST API: <a href="https://api.donald.todes.mx/">api.donald.todes.mx</a></li>
        <li>MCP endpoint: <code>https://mcp.donald.todes.mx/v1/mcp</code></li>
      </ul>
    </main>
{{- end }}
