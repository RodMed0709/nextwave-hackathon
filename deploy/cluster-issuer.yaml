# cert-manager issuers.
#
# The production issuer is named `lets-encrypt` — NOT `letsencrypt-prod`. That is
# the name every chart in the nuzur-go repo references in its
# `cert-manager.io/cluster-issuer` annotation, and a mismatch means no
# certificate is ever issued (the Ingress just quietly never gets one).
#
# The staging issuer exists because Let's Encrypt rate-limits failed production
# validations hard. If a certificate does not go Ready, point the three charts'
# annotation at `lets-encrypt-staging`, confirm the HTTP-01 challenge path works
# end to end, then switch back. Staging certs are untrusted by browsers — they
# only prove the challenge succeeds.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lets-encrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mklfarha@gmail.com
    privateKeySecretRef:
      name: lets-encrypt-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lets-encrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: mklfarha@gmail.com
    privateKeySecretRef:
      name: lets-encrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
